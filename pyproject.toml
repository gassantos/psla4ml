[project]
name = "psla4ml"
version = "0.1.0"
description =   "PSLA4ML combina hiperparâmetros em Pipelines ML conforme SLA"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "codecarbon>=3.2.2",
    "configparser>=7.2.0",
    "datasets>=4.5.0",
    "numpy>=2.2.6",
    "psutil>=7.2.2",
    "tensorboard>=2.14",
    "torch>=2.9,<2.10",
    "torchaudio>=2.9,<2.10",
    "torchvision>=0.24,<0.25",
    "tqdm>=4.67.1",
    "transformers[torch]>=5.2.0",

]

[project.optional-dependencies]
tpu = [
  # Torch XLA deve usar a mesma série minor do PyTorch.
  "torch_xla[tpu]>=2.9,<2.10; sys_platform == 'linux'",
]

[project.scripts]
bert-pli-train            = "scripts.train:main"
bert-pli-test             = "scripts.test:main"
bert-pli-poolout          = "scripts.poolout:main"
bert-pli-poolout-to-train = "scripts.poolout_to_train:main"
bert-pli-parse-results    = "scripts.parse_results:main"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'tpu'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'tpu'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and extra != 'tpu'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
cache_dir = "output/.pytest_cache"
